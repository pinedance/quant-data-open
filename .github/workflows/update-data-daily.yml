name: Update data daily

on:
  workflow_dispatch:

  # service-cron-jobs 로 대체
  # schedule:
    # Seoul 19:07 월-금 -> UTC 10:07
    # - cron: "07 10 * * *"

  # repository_dispatch:
  #   types: [update-data]

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Checkout data
      uses: actions/checkout@v4
      with:
        ref: output
        path: output
        depth: 1

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libxml2-dev libxslt-dev -y

    - uses: actions/setup-python@v5
      with:
        allow-prereleases: true

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      run: uv sync

    - name: Get Company List
      run: uv run scripts/get_kr_data_lists.py

    - name: Get US ETF Name List
      run: uv run scripts/get_us_data_lists.py

    - name: Get Etc Data 01
      run: uv run scripts/get_kr_data_nv.py

    - name: Get Etc Data 02
      run: uv run scripts/get_us_data_yh.py

    - name: Get Data From ECOS
      env:
        ECOS_KEY: ${{ secrets.ECOS_KEY }}
      run: uv run scripts/get_kr_data_ecos_daily.py

    - name: Build Misc Data
      run: uv run scripts/build_misc.py

    - name: Commit and push changes
      run: |
        cd output
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add .
        git diff --staged --quiet || git commit -m "get new data & update"
        git push origin HEAD:output